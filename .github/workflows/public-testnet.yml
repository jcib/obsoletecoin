name: Public testnet connectivity
on:
  workflow_dispatch:
    inputs:
      peer:
        description: Verified operator public IPv4 and port 19777
        required: true
        type: string
      minimum_height:
        description: Minimum height observed on the Dell before starting
        required: true
        type: string
permissions:
  contents: read
jobs:
  external-sync:
    runs-on: ubuntu-latest
    container: debian:13-slim
    timeout-minutes: 15
    steps:
      - name: Runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates python3 git libevent-2.1-7t64 libevent-extra-2.1-7t64 libevent-pthreads-2.1-7t64 libsqlite3-0
      - uses: actions/checkout@v4
      - name: Verify public TCP and the exact testnet genesis
        env:
          PEER: ${{ inputs.peer }}
        run: python3 -B release/probe-peer.py --peer "$PEER"
      - name: Download the exact Linux candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,tarfile,urllib.request,urllib.error,os,json
          from urllib.parse import urlsplit
          from pathlib import Path
          url='https://github.com/jcib/obsoletecoin/releases/download/v0.3.0-testnet-rc1/ObsoleteCoin-Linux-Testnet.tar.gz'
          class SafeRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self,req,fp,code,msg,headers,newurl):
              nxt=super().redirect_request(req,fp,code,msg,headers,newurl)
              if nxt and urlsplit(req.full_url).netloc!=urlsplit(newurl).netloc:nxt.remove_header('Authorization')
              return nxt
          opener=urllib.request.build_opener(SafeRedirect)
          try:
            data=opener.open(url,timeout=90).read()
            print('Downloaded anonymously from public release')
          except urllib.error.HTTPError as e:
            if e.code!=404:raise
            base='https://api.github.com/repos/jcib/obsoletecoin'
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'obsoletecoin-external-rehearsal'}
            releases=json.load(opener.open(urllib.request.Request(base+'/releases',headers=headers),timeout=30))
            release=next(r for r in releases if r['tag_name']=='v0.3.0-testnet-rc1')
            asset=next(a for a in release['assets'] if a['name']=='ObsoleteCoin-Linux-Testnet.tar.gz')
            headers['Accept']='application/octet-stream'
            data=opener.open(urllib.request.Request(asset['url'],headers=headers),timeout=90).read()
            print('Downloaded privately for external connectivity rehearsal; public downloads not verified')
          assert hashlib.sha256(data).hexdigest()=='e502798fabe872cfb06941de72b36a53815cb797aefcec117ec13fe55990855b'
          Path('/tmp/obsolete-testnet.tar.gz').write_bytes(data)
          with tarfile.open('/tmp/obsolete-testnet.tar.gz') as tar:tar.extractall('/tmp/obsolete-public-candidate',filter='data')
          PY
      - name: Synchronize a new independent wallet-disabled node
        env:
          PEER: ${{ inputs.peer }}
          MINIMUM_HEIGHT: ${{ inputs.minimum_height }}
        run: python3 -B release/public-sync.py --binary /tmp/obsolete-public-candidate/obsoletecoin-linux/bitcoind --peer "$PEER" --minimum-height "$MINIMUM_HEIGHT"
      - uses: actions/upload-artifact@v4
        with:
          name: public-testnet-connectivity
          path: public-sync-result.json
          if-no-files-found: error

name: Obsolete Coin experimental
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: obsolete-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 750M
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake pkgconf python3 python3-tk xvfb ccache libevent-dev libboost-dev libsqlite3-dev
      - uses: actions/cache@v4
        with:
          path: .ccache
          key: obsolete-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: obsolete-ccache-${{ runner.os }}-
      - name: RandomX libraries
        run: |
          cmake -S src/randomx -B src/randomx/build -DCMAKE_BUILD_TYPE=Release
          cmake --build src/randomx/build --target randomx -j2
          cmake -S src/randomx -B build-randomx-shared -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-randomx-shared --target randomx -j2
      - name: Reproduce experimental genesis
        run: python3 tools/genesis.py --library build-randomx-shared/librandomx.so
      - name: Save genesis evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis
          path: |
            src/consensus/obsolete_genesis.h
            docs/genesis.json
      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DENABLE_IPC=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build node, wallet and unit tests
        run: cmake --build build --target bitcoind bitcoin-cli bitcoin-wallet test_bitcoin -j2
      - name: Consensus and inherited unit tests
        run: ctest --test-dir build --output-on-failure -j1
      - name: Integration tests
        run: |
          if test -f tools/integration.py; then python3 tools/integration.py --bindir build/bin --library build-randomx-shared/librandomx.so; fi
          if test -d tests; then python3 -m unittest discover -s tests -v; fi
      - name: Package experimental Linux build
        run: |
          mkdir -p artifacts/obsoletecoin-linux
          cp build/bin/bitcoind build/bin/bitcoin-cli build/bin/bitcoin-wallet artifacts/obsoletecoin-linux/
          cp build-randomx-shared/librandomx.so artifacts/obsoletecoin-linux/
          cp -r tools docs artifacts/obsoletecoin-linux/
          cp README.md COPYING artifacts/obsoletecoin-linux/
          tar -czf artifacts/obsoletecoin-linux-experimental.tar.gz -C artifacts obsoletecoin-linux
          sha256sum artifacts/obsoletecoin-linux-experimental.tar.gz > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: obsoletecoin-linux-experimental
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS

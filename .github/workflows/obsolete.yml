name: Obsolete Coin experimental
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/readiness/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/readiness/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: obsolete-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake pkgconf python3 python3-tk xvfb xauth ccache libevent-dev libboost-dev libsqlite3-dev
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: obsolete-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: obsolete-ccache-${{ runner.os }}-
      - name: RandomX libraries
        run: |
          cmake -S src/randomx -B src/randomx/build -DCMAKE_BUILD_TYPE=Release
          cmake --build src/randomx/build --target randomx -j2
          cmake -S src/randomx -B build-randomx-shared -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,noexecstack
          cmake --build build-randomx-shared --target randomx -j2
      - name: Reproduce experimental genesis
        run: python3 tools/genesis.py --library build-randomx-shared/librandomx.so --verify
      - name: Save genesis evidence
        uses: actions/upload-artifact@v4
        with:
          name: genesis
          path: |
            src/consensus/obsolete_genesis.h
            docs/genesis.json
      - name: Configure
        run: cmake -B build -DBUILD_TESTS=ON -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DENABLE_IPC=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build node, wallet and unit tests
        run: cmake --build build -j2
      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: obsolete-ccache-${{ runner.os }}-${{ github.sha }}
      - name: Check ELF stack permissions
        run: python3 tools/check_hardening.py build/bin/bitcoind build/bin/bitcoin-wallet build-randomx-shared/librandomx.so
      - name: Consensus and inherited unit tests
        run: ctest --test-dir build --output-on-failure -j1
      - name: Integration tests
        run: |
          xvfb-run -a python3 tools/integration.py --bindir build/bin --library build-randomx-shared/librandomx.so
          python3 -m unittest discover -s tests -v
          xvfb-run -a python3 tools/ui_smoke.py
          python3 -m unittest discover -s tools -p 'test_wallet*.py' -v
          mkdir -p .local/readiness
          python3 tools/adversarial.py --binary build/bin/bitcoind --output .local/readiness/adversarial.json
          python3 tools/difficulty_simulation.py --output .local/readiness/difficulty.json
          sudo unshare --mount --fork sh release/test-disk-full.sh "$PWD/build/bin/bitcoind" "$PWD/.local/readiness/disk-full.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-linux
          path: .local/readiness/
      - name: Package experimental Linux build
        run: |
          python3 release/capture-linux-inputs.py --output .local/linux-build-inputs.json
          python3 release/assemble-linux.py --bindir build/bin --library build-randomx-shared/librandomx.so --inputs .local/linux-build-inputs.json --output artifacts/obsoletecoin-linux
          xvfb-run -a artifacts/obsoletecoin-linux/Start-Wallet.sh --self-test .local/readiness/linux-launcher.json
          tar -czf artifacts/obsoletecoin-linux-experimental.tar.gz -C artifacts obsoletecoin-linux
          sha256sum artifacts/obsoletecoin-linux-experimental.tar.gz > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: obsoletecoin-linux-experimental
          path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS

  debian13:
    name: Debian 13 runtime and wallet recovery
    needs: linux
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 15
    steps:
      - name: Runtime dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-tk xvfb xauth libevent-2.1-7t64 libevent-core-2.1-7t64 libevent-extra-2.1-7t64 libevent-pthreads-2.1-7t64 libsqlite3-0
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: obsoletecoin-linux-experimental
          path: artifacts
      - name: Verify and extract package
        run: |
          sha256sum -c artifacts/SHA256SUMS
          mkdir -p .local/package
          tar -xzf artifacts/obsoletecoin-linux-experimental.tar.gz -C .local/package
      - name: Mine, transfer, reorganize and restore on Debian 13
        run: |
          xvfb-run -a python3 tools/integration.py --bindir .local/package/obsoletecoin-linux --library .local/package/obsoletecoin-linux/librandomx.so
          xvfb-run -a .local/package/obsoletecoin-linux/Start-Wallet.sh --self-test .local/package/linux-launcher.json
          python3 -m unittest discover -s tests -v
          xvfb-run -a python3 tools/ui_smoke.py

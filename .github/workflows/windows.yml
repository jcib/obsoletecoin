name: Native Windows candidate
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'release/**', '.github/workflows/windows.yml', 'CMakeLists.txt']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libevent
            mingw-w64-ucrt-x86_64-sqlite3
      - name: Configure and build native node
        shell: msys2 {0}
        run: |
          cmake -S src/randomx -B rx-static -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build rx-static -j2
          cmake -S src/randomx -B rx-shared -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          cmake --build rx-shared -j2
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_GUI=OFF -DBUILD_BENCH=OFF -DBUILD_FUZZ_BINARY=OFF -DENABLE_IPC=OFF -DBRISVIA_RANDOMX_LIB="$PWD/rx-static/librandomx.a"
          cmake --build build-win -j2
          ctest --test-dir build-win --output-on-failure -j1
      - name: Collect native runtime
        shell: msys2 {0}
        run: |
          mkdir -p native
          cp build-win/bin/bitcoind.exe build-win/bin/bitcoin-cli.exe build-win/bin/bitcoin-wallet.exe native/
          cp rx-shared/*randomx.dll native/
          for exe in native/*.exe native/*.dll; do ldd "$exe"; done > native/dependencies.txt
          for dll in $(cat native/dependencies.txt | awk '/ucrt64.*dll/{print $3}' | sort -u); do cp "$dll" native/; done
          pacman -Q > native/toolchain.txt
          cp -r /ucrt64/share/licenses native/licenses
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.10'
      - name: Native Windows integration
        shell: pwsh
        run: |
          $Tk = (python release/prepare-tk.py | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'Tcl/Tk smoke failed' }
          if ($Tk.TCL_LIBRARY) { $env:TCL_LIBRARY = $Tk.TCL_LIBRARY; $env:TK_LIBRARY = $Tk.TK_LIBRARY }
          python -B tools/integration.py --bindir native --library native/librandomx.dll
          if ($LASTEXITCODE -ne 0) { throw 'Native integration failed' }
          python -B tools/adversarial.py --binary native/bitcoind.exe --output native/adversarial.json
          if ($LASTEXITCODE -ne 0) { throw 'Adversarial regression failed' }
          python -B -m unittest discover -s tools -p 'test_wallet*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Wallet regression failed' }
          python -B -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Client regression failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: obsoletecoin-windows-node
          path: native/
